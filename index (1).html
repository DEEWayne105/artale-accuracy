<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artale 怪物命中計算機</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#e9edf2;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:32px 20px}header{border-bottom:1px solid #34434b;padding-bottom:22px;margin-bottom:24px}h1{margin:8px 0;font-size:32px}small,p{color:#a9bac5;line-height:1.6}.tag{color:#f6c66b;letter-spacing:2px;font-size:13px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#192630;border:1px solid #34434b;border-radius:16px;padding:22px}h2{font-size:18px;margin:0 0 20px}label{display:block;color:#bacbd5;font-size:14px;margin:12px 0 6px}input,select,button{width:100%;padding:12px;border:1px solid #425560;border-radius:8px;background:#101820;color:#fff;font:inherit}button{cursor:pointer;background:#efc16a;color:#18232b;font-weight:bold;margin-top:12px} .pair,.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#101820;border-radius:10px;padding:16px}.stat strong{display:block;font-size:30px;color:#f6c66b;margin-top:6px}.wide{grid-column:1/-1}progress{width:100%;height:16px;accent-color:#efc16a}#status{font-weight:bold;color:#f6c66b}footer{font-size:13px;margin-top:20px;color:#a9bac5}a{color:#f6c66b}@media(max-width:650px){.layout{grid-template-columns:1fr}h1{font-size:26px}}</style><main><header><div class="tag">ARTALE / TOOLS</div><h1>怪物命中計算機</h1><p>輸入角色數值，快速評估挑戰怪物所需的命中值。</p></header><div class="layout"><section><h2>01　角色設定</h2><div class="pair"><div><label for="lv">自身等級</label><input id="lv" type="number" min="1" value="100"></div><div><label for="acc">目前命中值</label><input id="acc" type="number" min="0" value="180"></div></div><h2 style="margin-top:28px">02　怪物設定</h2><label for="search">搜尋怪物</label><input id="search" placeholder="輸入怪物名稱"><label for="mob">選擇怪物</label><select id="mob"></select><p id="source">目前使用示範資料，非遊戲正式數值。</p><button id="load">嘗試載入原網站怪物資料</button><div class="pair"><div><label for="ml">怪物等級</label><input id="ml" type="number" min="1" value="120"></div><div><label for="avoid">怪物迴避值（參考）</label><input id="avoid" type="number" min="0" value="40"></div><div><label for="base">同級命中需求</label><input id="base" type="number" min="0" value="150"></div><div><label for="coef">每級命中補償</label><input id="coef" type="number" min="0" step="0.01" value="5.7"></div></div></section><section><h2>03　計算結果</h2><div class="stats"><div class="stat"><small>等級差距（有效）</small><strong id="diff"></strong></div><div class="stat"><small>額外命中補償</small><strong id="extra"></strong></div><div class="stat wide"><small>預估必中需求</small><strong id="req" style="font-size:52px"></strong></div><div class="stat"><small>目前命中</small><strong id="cur"></strong></div><div class="stat"><small>尚缺命中值</small><strong id="lack"></strong></div></div><p>必中需求達成比例：<b id="pct"></b></p><progress id="bar" max="100"></progress><p id="status"></p><hr style="border:0;border-top:1px solid #34434b"><small>暫定公式：同級命中需求 + MAX(0, 怪物等級 − 自身等級) × 每級命中補償，結果無條件進位。達成比例不是實際命中機率。</small></section></div><footer>資料來源候選：<a href="https://a2983456456.github.io/artale-drop/" target="_blank" rel="noopener">Artale Drop</a>。此版本為介面原型，公式與資料欄位尚待驗證。</footer></main><script>const $=id=>document.getElementById(id);let mobs=[{name:'示範怪物 A',level:120,avoid:40,base:150,coef:5.7},{name:'示範怪物 B',level:80,avoid:25,base:95,coef:3.5},{name:'示範怪物 C',level:150,avoid:55,base:200,coef:7}];function list(){let q=$('search').value.toLowerCase();$('mob').replaceChildren(new Option('手動輸入',''));mobs.forEach((m,i)=>{if(m.name.toLowerCase().includes(q))$('mob').add(new Option(m.name+' · Lv.'+m.level,i))})}function choose(){if($('mob').value==='')return;let m=mobs[+$('mob').value];for(let [id,key] of [['ml','level'],['avoid','avoid'],['base','base'],['coef','coef']])$(id).value=m[key]??'';calc()}function calc(){let ids=['lv','acc','ml','base','coef'];if(ids.some(id=>$(id).value===''||!$(id).checkValidity())){for(let id of ['diff','extra','req','cur','lack','pct'])$(id).textContent='—';$('bar').value=0;$('status').textContent='請填入有效數值；未知欄位需手動確認。';return}let [l,a,m,b,c]=ids.map(id=>+$(id).value),d=Math.max(0,m-l),e=d*c,r=Math.ceil(b+e-1e-9),p=r?Math.min(100,a/r*100):100;for(let [id,v] of Object.entries({diff:d,extra:+e.toFixed(2),req:r,cur:a,lack:Math.max(0,r-a),pct:p.toFixed(1)+'%'}))$(id).textContent=v;$('bar').value=p;$('status').textContent=a>=r?'已達暫定必中需求':'尚需增加 '+(r-a)+' 點命中值'}$('search').oninput=list;$('mob').onchange=choose;document.querySelectorAll('input[type=number]').forEach(x=>x.oninput=calc);$('load').onclick=async()=>{ $('source').textContent='正在嘗試載入…';try{let res=await fetch('https://a2983456456.github.io/artale-drop/mob.json');if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();let rows=Array.isArray(data)?data:Object.values(data);let parsed=rows.filter(x=>x&&typeof x==='object').map(x=>({name:x.name??x.mobName??x['名稱']??x['怪物名稱'],level:x.level??x.lv??x['等級'],avoid:x.avoid??x.eva??x['迴避值']})).filter(x=>typeof x.name==='string'&&x.level!=null&&Number.isFinite(Number(x.level)));if(!parsed.length)throw Error('資料結構尚未對應');mobs=parsed;list();$('source').textContent='已讀取 '+mobs.length+' 筆候選資料；命中需求與補償需手動輸入並驗證。'}catch(e){$('source').textContent='載入失敗：'+e.message+'。保留目前資料，可手動輸入。'}};list();$('mob').value='0';choose();</script></html>
